<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - Java OOP</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/styles.css?v=2">
</head>
<body>
    <!-- Header (fixed) -->
    <header class="header">
        <div class="header-content">
            <h1>🎓 AI Tutor - Java OOP</h1>
            <div class="header-controls">
                <button id="darkModeToggle" class="icon-btn" type="button"
                        aria-label="Εναλλαγή σκοτεινής λειτουργίας"
                        title="Εναλλαγή σκοτεινής λειτουργίας">
                    <span class="icon" aria-hidden="true">🌙</span>
                </button>
                <button id="resetButton" class="reset-btn" type="button" aria-label="Νέα συνομιλία">
                    <span class="icon" aria-hidden="true">🗑️</span>
                    <span class="text">Νέα Συνομιλία</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Chat Area -->
    <main class="chat-main" id="chatContainer">
        <div class="welcome-message">
            <div class="avatar bot-avatar" aria-hidden="true">🤖</div>
            <div class="message-bubble assistant-bubble">
                Γεια σου! Είμαι ο AI Tutor σου για Java OOP. Ρώτησέ με οτιδήποτε για Αντικειμενοστραφή Προγραμματισμό!
            </div>
        </div>
    </main>

    <!-- Input -->
    <footer class="input-footer">
        <div class="input-wrapper">
            <textarea
                id="messageInput"
                placeholder="Ρωτήστε κάτι για Java ..."
                rows="1"
                aria-label="Μήνυμα"
            ></textarea>
            <button id="sendButton" class="send-btn" type="button" aria-label="Αποστολή">
                <span class="icon" aria-hidden="true">📤</span>
            </button>
        </div>
    </footer>

    <script src="/static/script.js?v=2"></script>
</body>
</html>
